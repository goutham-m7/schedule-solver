[project]
name = "schedule-solver"
version = "0.2.0"
description = "Explainable CP-SAT meeting scheduling with checked insertion conflicts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Goutham Madineni", email = "151193576+goutham-m7@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "python-dateutil>=2.9.0.post0",
    "ortools>=9.15.6755",
    "uvicorn>=0.54.0",
]

[project.scripts]
schedule-solver = "schedule_solver.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["schedule_solver"]
